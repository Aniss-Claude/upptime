# NOTE (Aniis): the "do not edit directly" banner above no longer applies here.
# Update Template CI is disabled and .templaterc.json syncs nothing, so this file is
# maintained by hand. See docs/ops/status-page.md in Aniss-Claude/aniis-claude.

name: Summary CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
# The Aniss-Claude org forces the default GITHUB_TOKEN to read-only, so these
# workflows 403'd on push. Granting the two scopes Upptime actually needs at the
# workflow level keeps the org's safe read-only default intact everywhere else
# and avoids having to mint a personal access token.
#   contents: commit history/graphs/api and push the built site to gh-pages
#   issues:   open an issue when a site goes down, close it when it recovers
permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Generate README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@v1.43.13
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
